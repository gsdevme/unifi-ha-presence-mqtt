# Dev-only MQTT broker for local smoke testing (see README "Local" section).
# Not used in production.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: >
      sh -c "printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf
      && exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
